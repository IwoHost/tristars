<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1440">
<title>TriStars</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- join screen -->
<div id="join" class="screen">
  <div class="panel">
    <h1 class="logo">TRI<span>★</span>STARS</h1>
    <input id="name" maxlength="14" placeholder="Your name" autocomplete="off">
    <div class="label">Pick your brawler</div>
    <div id="joinGrid" class="grid"></div>
    <button id="lanBtn" class="big hidden">PLAY ON THIS WI-FI SERVER</button>
    <div class="p2p">
      <button id="hostBtn" class="big blue">HOST GAME</button>
      <div class="joinRow">
        <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="codeBtn" class="big">JOIN</button>
      </div>
    </div>
    <div id="joinMsg" class="hint"></div>
  </div>
</div>

<!-- lobby -->
<div id="lobby" class="screen hidden">
  <div class="panel wide">
    <div class="lobbyTop">
      <h1 class="logo small">TRI<span>★</span>STARS</h1>
      <div id="joinUrl" class="hint"></div>
      <button id="leaveBtn" class="small">Leave</button>
    </div>
    <div class="lobbyCols">
      <div class="col">
        <div class="label">Mode</div>
        <div id="modes" class="modes"></div>
        <label class="toggle"><input type="checkbox" id="bots"> Fill with bots 🤖</label>
        <div id="teams" class="teams"></div>
      </div>
      <div class="col">
        <div class="label">Brawler</div>
        <div id="lobbyGrid" class="grid"></div>
      </div>
    </div>
    <button id="startBtn" class="big">START</button>
    <div id="waitMsg" class="hint"></div>
  </div>
</div>

<!-- in-game HUD -->
<div id="hud" class="hidden">
  <div id="labels"></div>
  <div id="score"></div>
  <div id="center"></div>
  <div id="joyBase" class="joy hidden"><div id="joyKnob"></div></div>
  <div id="superBtn" class="btn super"><span>⚡</span></div>
  <div id="jumpBtn" class="btn jump"><span>⤒</span></div>
  <div id="atkBtn" class="btn atk"><span>🎯</span></div>
  <div id="fsBtn">⛶</div>
  <div id="feed"></div>
  <div id="respawnPick" class="hidden"></div>
</div>

<!-- end screen -->
<div id="end" class="screen hidden">
  <div class="panel">
    <h1 id="endTitle"></h1>
    <div id="endSub" class="hint"></div>
    <div id="awards"></div>
    <div id="endStats"></div>
    <button id="rematchBtn" class="big hidden">REMATCH 🔁</button>
    <div class="hint">Back to lobby in a moment…</div>
  </div>
</div>

<div id="conn" class="hidden">Connecting…</div>
<script type="module" src="main.js"></script>
</body>
</html>
